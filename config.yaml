# Naukri Job Hunter & AI Resume Customizer Configuration

search:
  # Job role keywords (e.g. "Full Stack Developer", "Python Developer", "Data Scientist")
  role: "Full Stack Developer"
  
  # Target city (e.g. "Bengaluru", "Pune", "Hyderabad", "Delhi / NCR", "Mumbai", "Remote")
  city: "Bengaluru"
  
  # Desired CTC range in LPA (Lakhs Per Annum)
  # Set min_ctc_lpa to 0 to include listings without explicit salary or entry-level
  min_ctc_lpa: 12
  max_ctc_lpa: 25
  
  # Candidate experience in years
  experience_years: 3
  
  # Maximum listings to scrape per search run
  max_results: 25

resume:
  # Path to your master resume PDF (input)
  master_pdf_path: "data/master_resume.pdf"
  
  # Path where structured profile JSON is stored
  master_profile_path: "data/master_profile.json"
  
  # Directory where tailored PDFs will be generated
  output_dir: "output/resumes"

bot:
  # Application mode: "supervised" (interactive approval) or "auto" (hands-free applying)
  mode: "supervised"
  
  # Minimum ATS match score (0-100) to proceed with tailoring & applying
  min_match_score: 65
  
  # Run browser in headless mode (False recommended for Naukri to avoid bot triggers)
  headless: false
  
  # Min and max delay range in seconds between browser actions to mimic human interaction
  human_delay_range: [2.5, 6.0]
  
  # Allow applying to internal Naukri "Apply" / "Easy Apply" postings
  auto_easy_apply: true

gemini:
  # Model to use for tailoring and parsing
  model_name: "gemini-2.5-flash"
